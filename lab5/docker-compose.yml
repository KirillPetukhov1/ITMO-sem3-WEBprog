services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: students
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U students -d students"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/students
      DB_USERNAME: students
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    # браузер в java больше не ходит - только сервер next по внутренней сети.
    # порт наружу оставлен для swagger, только на localhost
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://backend:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STUDENTS_REVALIDATE: ${STUDENTS_REVALIDATE:-30}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:3000"

volumes:
  postgres_data:

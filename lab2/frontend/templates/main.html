<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление студентами</title>
    <link rel="icon" href="/static/resources/funny_cat.jpg">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" type="module"></script>
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <h1>Система учета студентов</h1>
            <button class="button primary" id="add-button" type="button">Добавить студента</button>
        </div>
    </header>

    <main class="container">
        <section class="page active" id="list-page" aria-labelledby="list-heading">
            <h2 id="list-heading" class="visually-hidden">Список студентов</h2>

            <form id="filter-form" class="filter-form">
                <h2>Фильтры и сортировка</h2>

                <div class="form-grid filter-grid">
                    <div class="form-group">
                        <label for="filter-full-name">ФИО</label>
                        <input id="filter-full-name" type="search" placeholder="Иванов">
                    </div>

                    <div class="form-group">
                        <label for="filter-group">Группа</label>
                        <input id="filter-group" type="text" pattern="[A-Z][0-9]{4}" maxlength="5"
                            placeholder="P1234">
                    </div>

                    <div class="form-group">
                        <label for="filter-isu-id">ИСУ ID</label>
                        <input id="filter-isu-id" type="text" pattern="[0-9]{6}" maxlength="6"
                            inputmode="numeric" placeholder="123456">
                    </div>

                    <div class="form-group">
                        <label for="filter-dormitory">Общежитие</label>
                        <input id="filter-dormitory" type="number" min="1" max="99">
                    </div>

                    <div class="form-group">
                        <label for="filter-room">Комната</label>
                        <input id="filter-room" type="number" min="1" max="9999">
                    </div>

                    <div class="form-group">
                        <label for="filter-is-foreigner">Иностранный студент</label>
                        <select id="filter-is-foreigner">
                            <option value="">Неважно</option>
                            <option value="true">Да</option>
                            <option value="false">Нет</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sort-by">Сортировать по</label>
                        <select id="sort-by">
                            <option value="">Без сортировки</option>
                            <option value="fullName">ФИО</option>
                            <option value="group">Группе</option>
                            <option value="isuId">ИСУ ID</option>
                            <option value="dormitory">Общежитию</option>
                            <option value="room">Комнате</option>
                            <option value="settlementDate">Сроку заселения</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sort-order">Порядок</label>
                        <select id="sort-order">
                            <option value="asc">По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="button primary" type="submit">Применить</button>
                    <button class="button secondary" id="reset-filter-button" type="button">Сбросить</button>
                </div>
            </form>

            <div class="table-wrapper">
                <table>
                    <caption class="visually-hidden">Список студентов с колонками: ФИО, группа, ИСУ ID, общежитие, комната и действия</caption>
                    <thead>
                        <tr>
                            <th scope="col">ФИО</th>
                            <th scope="col">Группа</th>
                            <th scope="col">ИСУ ID</th>
                            <th scope="col">Общежитие</th>
                            <th scope="col">Комната</th>
                            <th scope="col">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="students-table"></tbody>
                </table>
            </div>
            <p class="empty-message" id="empty-message" aria-live="polite">Список студентов пуст.</p>
            <nav class="form-actions pagination" aria-label="Страницы списка">
                <button class="button secondary" id="previous-page" type="button" disabled>Назад</button>
                <span id="page-info" role="status" aria-live="polite">Загрузка...</span>
                <button class="button secondary" id="next-page" type="button" disabled>Вперёд</button>
                <label for="page-size">На странице</label>
                <select id="page-size">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </nav>
        </section>

        <section class="page" id="form-page" aria-labelledby="form-title">
            <h2 id="form-title">Добавление студента</h2>

            <form id="student-form">
                <input type="hidden" id="original-isu-id">

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="full-name">ФИО студента</label>
                        <input id="full-name" type="text" required minlength="5" maxlength="100"
                            placeholder="Иванов Иван Иванович">
                        <span class="error" data-error-for="fullName"></span>
                    </div>

                    <div class="form-group">
                        <label for="group">Группа</label>
                        <input id="group" type="text" required pattern="[A-Z][0-9]{4}" maxlength="5"
                            placeholder="P1234">
                        <span class="error" data-error-for="group"></span>
                    </div>

                    <div class="form-group">
                        <label for="isu-id">ИСУ ID</label>
                        <input id="isu-id" type="text" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric"
                            placeholder="123456">
                        <span class="error" data-error-for="isuId"></span>
                    </div>

                    <div class="form-group">
                        <label for="dormitory">Номер общежития</label>
                        <input id="dormitory" type="number" required min="1" max="99">
                        <span class="error" data-error-for="dormitory"></span>
                    </div>

                    <div class="form-group">
                        <label for="room">Комната</label>
                        <input id="room" type="number" required min="1" max="9999">
                        <span class="error" data-error-for="room"></span>
                    </div>

                    <div class="form-group">
                        <label for="settlement-date">Срок заселения</label>
                        <input id="settlement-date" type="date" min="2000-01-01" required>
                        <span class="error" data-error-for="settlementDate"></span>
                    </div>

                    <div class="form-group checkbox-group">
                        <label>
                            <input id="is-foreigner" type="checkbox">
                            Иностранный студент
                        </label>
                        <span class="error" data-error-for="isForeigner"></span>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Заметки</label>
                        <textarea id="notes" rows="4" maxlength="500"></textarea>
                        <span class="error" data-error-for="notes"></span>
                    </div>
                </div>

                <p class="error form-error" id="form-error" role="alert" hidden></p>

                <div class="form-actions">
                    <button class="button primary" type="submit">Сохранить</button>
                    <button class="button secondary" id="cancel-button" type="button">Отмена</button>
                </div>
            </form>
        </section>

        <section class="page" id="details-page" aria-labelledby="details-heading">
            <h2 id="details-heading" class="visually-hidden">Досье студента</h2>
            <div class="details" id="student-details"></div>

            <div class="form-actions">
                <button class="button primary" id="edit-details-button" type="button">Редактировать</button>
                <button class="button secondary" id="back-button" type="button">Назад</button>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>

</html>
